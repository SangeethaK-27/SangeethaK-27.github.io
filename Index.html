<!DOCTYPE html>
<html>
    <head>
        <title>My Profile Card</title>
        
        <style>
            
            body {
    background: #f0f0f0;
    font-family: Arial;
    text-align: center;
    padding-top: 50px;
  }

  .card {
    background: white;
    width: 300px;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px gray;
    margin: auto;
  }

  button {
    padding: 10px 20px;
    margin-top: 10px;
    border: none;
    background: blue;
    color: white;
    border-radius: 5px;
    font-size: 16px;
  }

  input {
    padding: 8px;
    width: 90%;
    margin-top: 10px;
  }
        </style>
    </head>
    <body>
        <div class="card">
           
            <h2 id="myname">your name</h2>
            <input id="nameInput" placeholder="Type your name">
            <button onclick="changeName()">update name</button>
            <p id="message">Welcome to my profile.</p>
            <button onclick="changeMessage()">change message</button>
       
        </div>
        
        <script>
            function changeName() {
                let name = document.getElementById("nameInput").value;
                
                document.getElementById("myname").innerText = name;
            }
            
            function changeMessage() {
                document.getElementById("message").innerText = "I am learning full stack development!"
            }
            
            
        </script>
    </body>
</html>
